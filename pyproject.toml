[project]
name = "ha-brivo-mobile-pass"
version = "0.2.0"
description = "Open Brivo Mobile Pass gates and doors from Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.372", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
