name: Validate
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Identify Markdown-only changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          known = {b"README.md", b"CONTRIBUTING.md", b"SECURITY.md", b"CHANGELOG.md"}
          diff = subprocess.run(
              ["git", "diff", "--name-only", "-z", "--no-renames", os.environ["BASE_SHA"], "HEAD", "--"],
              stdout=subprocess.PIPE,
              check=False,
          )
          paths = diff.stdout.split(b"\0")[:-1]
          docs_only = diff.returncode == 0 and bool(paths) and all(
              path in known or (path.startswith(b"docs/") and path.endswith(b".md"))
              for path in paths
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"docs_only={str(docs_only).lower()}", file=output)
          print("Markdown-only draft" if docs_only else "Full validation required")
          PYTHON

  draft-lint:
    if: needs.scope.outputs.docs_only == 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: draft-lint
      - run: uv sync --locked --no-default-groups --group dev
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --no-sync ruff check ."
          uv run --no-sync ruff check . || status=1
          printf "\n> %s\n" "uv run --no-sync ruff format --check ."
          uv run --no-sync ruff format --check . || status=1
          exit "$status"
  compatibility:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    name: compatibility (${{ matrix.lane }}, Core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            group: dev
            core: "2026.10.0"
            harness: pytest-homeassistant-custom-component
            harness-version: "0.13.371"
          - lane: latest
            group: ci-latest
            core: "2026.11.0"
            harness: pytest-homeassistant
            harness-version: "2026.11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.lane }}
      - run: uv sync --locked --no-default-groups --group "${{ matrix.group }}"
      - name: Verify exact Core and harness versions
        env:
          HA_CORE: ${{ matrix.core }}
          HA_HARNESS: ${{ matrix.harness }}
          HA_HARNESS_VERSION: ${{ matrix.harness-version }}
        run: >-
          uv run --no-sync python scripts/check_ha_test_versions.py
          "$HA_CORE" "$HA_HARNESS" "$HA_HARNESS_VERSION"
      - name: Run lint, formatting and available type checks
        shell: bash
        run: |
          status=0
          printf "\n> %s\n" "uv run --no-sync ruff check ."
          uv run --no-sync ruff check . || status=1
          printf "\n> %s\n" "uv run --no-sync ruff format --check ."
          uv run --no-sync ruff format --check . || status=1
          exit "$status"
      - run: uv run --no-sync pytest
  actionlint:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Actionlint 1.7.12
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      # Inline Python is exercised by the policy tests; don't depend on an
      # incidental pyflakes installation. Keep Actionlint's Shellcheck enabled.
      - name: Lint all workflows including privileged automation
        run: '"$RUNNER_TEMP/actionlint" -color -pyflakes ""'
  # Retain the branch-protection context; skipped/cancelled dependencies must fail closed.
  tests:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft validation' || 'tests' }}
    if: ${{ always() && needs.scope.outputs.docs_only != 'true' }}
    needs: [scope, compatibility, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation dependency to succeed
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$ACTIONLINT_RESULT" = success
  hassfest:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
  hacs:
    if: ${{ !cancelled() && needs.scope.outputs.docs_only != 'true' }}
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false
