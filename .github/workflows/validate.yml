name: Validate
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compatibility:
    name: compatibility (${{ matrix.lane }}, Core ${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: minimum
            group: dev
            core: "2026.10.0"
            harness: pytest-homeassistant-custom-component
            harness-version: "0.13.371"
          - lane: latest
            group: ci-latest
            core: "2026.11.0"
            harness: pytest-homeassistant
            harness-version: "2026.11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ matrix.lane }}
      - run: uv sync --locked --no-default-groups --group "${{ matrix.group }}"
      - name: Verify exact Core and harness versions
        env:
          HA_CORE: ${{ matrix.core }}
          HA_HARNESS: ${{ matrix.harness }}
          HA_HARNESS_VERSION: ${{ matrix.harness-version }}
        run: >-
          uv run --no-sync python scripts/check_ha_test_versions.py
          "$HA_CORE" "$HA_HARNESS" "$HA_HARNESS_VERSION"
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Actionlint 1.7.12
        run: |
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      # Inline Python is exercised by the policy tests; don't depend on an
      # incidental pyflakes installation. Keep Actionlint's Shellcheck enabled.
      - name: Lint all workflows including privileged automation
        run: '"$RUNNER_TEMP/actionlint" -color -pyflakes ""'
  # Retain the branch-protection context; skipped/cancelled dependencies must fail closed.
  tests:
    if: ${{ always() }}
    needs: [compatibility, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation dependency to succeed
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          test "$COMPATIBILITY_RESULT" = success
          test "$ACTIONLINT_RESULT" = success
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          comment: false

  hacs-cache-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HACS_IMAGE: ghcr.io/hacs/action@sha256:35241cb9a8ce6a83f3fbe893880283419c59bea26e71d4c99e279856518bde25
      HACS_CONFIG: sha256:34938eab6f3d8de3ab3c2a2b98d3c828f7f41ff6a28756ac672f3aec83aff45c
      HACS_TAG: hacs-ci:35241cb9a8ce6a83f3fbe893880283419c59bea26e71d4c99e279856518bde25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned HACS image archive
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/hacs-action.tar
          key: hacs-image-${{ runner.os }}-${{ runner.arch }}-${{ env.HACS_IMAGE }}
      - name: Load or pull the pinned HACS image
        shell: bash
        run: |
          archive="$RUNNER_TEMP/hacs-action.tar"
          if [[ -f "$archive" ]]; then
            docker load --input "$archive"
          else
            docker pull "$HACS_IMAGE"
            docker tag "$HACS_IMAGE" "$HACS_TAG"
            docker save "$HACS_TAG" -o "$archive"
          fi
          image_id=$(docker image inspect --format '{{.Id}}' "$HACS_TAG")
          [[ "$image_id" == "$HACS_CONFIG" || "$image_id" == "${HACS_IMAGE#*@}" ]]
      - name: Validate HACS repository
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_CATEGORY: integration
          INPUT_COMMENT: 'false'
        run: |
          docker run --rm --pull=never \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -v "$GITHUB_EVENT_PATH:/github/workflow/event.json:ro" \
            -w /github/workspace \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_EVENT_PATH=/github/workflow/event.json \
            -e GITHUB_REPOSITORY -e GITHUB_ACTOR \
            -e INPUT_GITHUB_TOKEN -e INPUT_CATEGORY -e INPUT_COMMENT \
            "$HACS_TAG"
